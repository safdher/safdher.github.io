name: Build site

on:
  push:
    branches: [master]
    paths: ['site-src/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build
        working-directory: site-src
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Publish build to repo root
        run: |
          rm -rf assets
          cp -r site-src/dist/. .
          rm -rf site-src/dist site-src/node_modules
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html assets
          git diff --cached --quiet || git commit -m "Build site from site-src"
          git push
